# Default configuration for coupled heart-brain Hopf system
# All frequencies in Hz; converted to rad/s internally (2*pi*f_hz)

data:
  ecg_path: "transdef_mf2pt2_rest_raw.fif"
  eeg_path: "scout_id_309.mat"
  sc_path: "SC_CC120309-27.mat"
  ecg_channel: 322
  t_start: 2000
  t_end: 4000
  fs_raw: 1000

preprocessing:
  ecg_lowcut: 1.5
  ecg_highcut: 20
  eeg_lowcut: 0.5
  eeg_highcut: 20
  ecg_negate: true

model:
  heart:
    input_dim: 4
    hidden_dim: 100
    feature_dim: 50
    output_dim: 1
  ecg_to_brain:
    ecg_dim: 50
    n_vns: 64
    hidden_dim: 64
    output_dim: 9  # N from brain (computed at runtime)
  oscillator:
    n_osc: 64
    fs: 100
    T: 2.0
    coupling_sparsity: 0.3
    coupling_strength: 0.05
    freq_hz_min: 2.0
    freq_hz_max: 10.0
  feedback:
    input_dim: 1
    hidden_dim: 64
    output_dim: 2

dynamics:
  heart:
    # Hz; heart rate ~1-1.5 Hz
    omega1_hz: 1.0
    omega2_hz: 1.2
    alpha: 1.0
    A_init: 0.0001
    theta_init: 3.14159
    n: 1.0
  brain:
    mu: 1.0
    eta_theta: 0.05
    eta_omega: 0.05
    eta_alpha: 0.005
    osc_per_region: 3
    omega_hz_min: 1.0
    omega_hz_max: 20.0
    alpha_min: 0.05
    alpha_max: 0.5

training:
  heart_epochs: 25000
  brain_epochs: 30
  mlp_epochs: 100
  feedback_epochs: 5000
  heart_lr: 1e-3
  mlp_lr: 1e-2
  feedback_lr: 1e-3
  seed: 42
  log_interval: 500
  ckpt_interval: 5000
  val_split: 0.2

paths:
  output_dir: "results"
  checkpoints_dir: "checkpoints"
  figures_dir: "figures"
  logs_dir: "logs"

target_indices: [4]
